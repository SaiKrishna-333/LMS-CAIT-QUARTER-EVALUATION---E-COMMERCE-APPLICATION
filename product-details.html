<!DOCTYPE html>
<!-- ==========================================================================
     NOVA - product-details.html   ***** FILE GUIDE (MASTER COMMENT) *****
     --------------------------------------------------------------------------
     IN ONE SENTENCE: The detailed view for ONE product, opened with an id in
     the address bar (product-details.html?id=P7). It has shells for the image
     gallery, the buy box, the colour/quantity pickers, the info tabs and a
     related-products row - all filled by product-details.js at load.

     MARKUP VS LOGIC
     This file only reserves the areas (with the right element ids). The script
     looks the product up in storage.js and writes the real content into those
     areas: pictures from the SVG factory, price + savings, stock status, the
     description/specs/reviews tabs and matching related items.

     SCRIPTS LOADED: storage.js -> common.js -> product-details.js.
     Buttons here call the shared addToCart()/toggleWishlist()/addToCompare()
     from common.js, so actions behave identically to the rest of the shop.
     ========================================================================== -->
<!-- ==========================================================================
     NOVA - product-details.html
     Opened as product-details.html?id=P1 - the id URL parameter chooses
     which product to show. Layout follows reference image 2.
     ========================================================================== -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product &ndash; NOVA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        /* Page-specific layout for the two-column product view */
        .pd-grid {
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 34px;
            align-items: start;
        }

        .pd-gallery {
            display: flex;
            gap: 14px;
        }

        .pd-thumbs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pd-thumbs img {
            width: 74px;
            height: 74px;
            border-radius: 12px;
            border: 2px solid var(--border);
            padding: 4px;
            background: var(--card);
            cursor: pointer;
        }

        .pd-thumbs img.selected {
            border-color: var(--violet);
            box-shadow: var(--glow);
        }

        .pd-main {
            flex: 1;
            background: radial-gradient(circle at 50% 40%, var(--panel-2), var(--bg-deep));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 26px;
        }

        .pd-main img {
            max-height: 460px;
            margin: 0 auto;
            object-fit: contain;
        }

        .pd-price-row {
            display: flex;
            align-items: baseline;
            gap: 14px;
            margin: 14px 0;
        }

        .pd-price {
            font-size: 1.9rem;
            font-weight: 800;
        }

        /* Feature chips under the description (icons + short text) */
        .pd-features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 18px 0;
        }

        .pd-feature {
            font-size: 0.8rem;
            color: var(--text-2);
        }

        .pd-feature i,
        .pd-feature svg {
            color: var(--violet);
            margin-bottom: 6px;
        }

        .pd-buy-row {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .pd-buy-row .btn {
            flex: 1;
            min-width: 150px;
        }

        /* Quantity stepper */
        .qty-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0;
        }

        .qty-stepper {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .qty-stepper button {
            width: 38px;
            height: 38px;
            background: var(--panel);
            border: none;
            color: var(--violet);
            font-size: 1.1rem;
            cursor: pointer;
        }

        .qty-stepper input {
            width: 52px;
            height: 38px;
            text-align: center;
            border: none;
            background: var(--card);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.95rem;
        }

        /* Colour variant dots (visual choice, saved with the cart line) */
        .swatches {
            display: flex;
            gap: 10px;
        }

        .swatch {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid var(--border);
            cursor: pointer;
        }

        .swatch.selected {
            border-color: var(--violet);
            box-shadow: var(--glow);
        }

        .trust-row {
            display: flex;
            gap: 18px;
            margin-top: 16px;
            font-size: 0.8rem;
            color: var(--text-2);
            flex-wrap: wrap;
        }

        .trust-row span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Review list inside the Reviews tab */
        .review {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            background: var(--card);
        }

        .review .r-head {
            display: flex;
            justify-content: space-between;
            font-size: 0.84rem;
            margin-bottom: 6px;
        }

        /* Rating distribution bars */
        .dist-row {
            display: grid;
            grid-template-columns: 34px 1fr 40px;
            gap: 10px;
            align-items: center;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .dist-bar {
            height: 8px;
            border-radius: 6px;
            background: var(--bg-deep);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .dist-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--purple), var(--violet));
        }
    </style>
</head>

<body>

    <header class="site-header" id="siteHeader"></header>

    <main class="container page-section">
        <div class="breadcrumb" id="breadcrumb">
            <a href="index.html">Home</a> <span>/</span>
            <a href="products.html">Shop</a> <span>/</span>
            <a href="products.html" id="crumbCategory">Category</a> <span>/</span>
            <span class="current" id="crumbName">Product</span>
        </div>

        <!-- Everything below is filled in by product-details.js -->
        <div class="pd-grid">
            <div class="pd-gallery">
                <div class="pd-thumbs" id="thumbs"></div>
                <div class="pd-main"><img id="mainImage" alt="Product image"></div>
            </div>
            <div id="pdInfo"></div>
        </div>

        <!-- Tabs: Overview / Specifications / Reviews / Shipping -->
        <div class="card" style="margin-top:34px">
            <div class="tabs">
                <button class="tab-btn active" data-tab="overview">Overview</button>
                <button class="tab-btn" data-tab="specs">Specifications</button>
                <button class="tab-btn" data-tab="reviews">Reviews</button>
                <button class="tab-btn" data-tab="shipping">Shipping &amp; Returns</button>
            </div>
            <div class="tab-panel active" id="tab-overview"></div>
            <div class="tab-panel" id="tab-specs"></div>
            <div class="tab-panel" id="tab-reviews"></div>
            <div class="tab-panel" id="tab-shipping">
                <p>&#10003;&nbsp; Free shipping on orders above the limit shown in the cart.<br>
                    &#10003;&nbsp; 30-day no-questions returns on all products.<br>
                    &#10003;&nbsp; 2-year manufacturer warranty on electronics.<br>
                    &#10003;&nbsp; Dispatch within 24 hours from the demo warehouse.</p>
            </div>
        </div>

        <!-- Related products -->
        <div class="section-title" style="margin-top:44px">
            <div>
                <h2>You May Also Like</h2>
                <div class="accent-bar"></div>
            </div>
        </div>
        <div class="product-grid" id="relatedGrid"></div>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>
    <div id="toast-area"></div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/common.js"></script>
    <script src="js/product-details.js"></script>
</body>

</html>
