<!DOCTYPE html>
<!-- ==========================================================================
     NOVA - admin/marketing.html   ***** FILE GUIDE (MASTER COMMENT) *****
     --------------------------------------------------------------------------
     IN ONE SENTENCE: The promotions page of the console. It is the shell that
     marketing.js fills with controls to run the flash sale, set the delivery
     charge and choose which products are shown as "Featured" on the shop.

     HOW ADMIN PAGES WORK
     Standard admin recipe: storage.js, common.js and admin.js load first,
     renderAdminShell() guards access + draws the chrome, and the page script
     populates #adminContent.

     SCRIPTS LOADED: storage.js -> common.js -> admin.js -> marketing.js.
     Every choice here is written into novaSettings, so toggling the flash sale
     or changing the delivery fee visibly affects the homepage countdown and
     the cart totals on the customer side.
     ========================================================================== -->
<!-- ==========================================================================
     NOVA - admin/marketing.html  (FLASH SALE / OFFERS / FEATURED PRODUCTS)
     ========================================================================== -->
