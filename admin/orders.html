<!-- ==========================================================================
     NOVA - admin/orders.html   ***** FILE GUIDE (MASTER COMMENT) *****
     --------------------------------------------------------------------------
     IN ONE SENTENCE: The order-management page of the console. It is the
     shell that admin-orders.js fills with every customer order so the owner
     can inspect each one and move it along the delivery pipeline.

     HOW ADMIN PAGES WORK
     Standard admin recipe: storage.js, common.js and admin.js load first,
     renderAdminShell() guards access + draws the chrome, and the page script
     populates #adminContent.

     SCRIPTS LOADED: storage.js -> common.js -> admin.js -> admin-orders.js.
     Changing an order's status here writes to novaOrders, which is exactly what
     makes that order's tracking timeline advance on the customer's own orders
     page - one shared record, two views.
     ========================================================================== -->

     NOVA - admin/orders.html  (ORDER MANAGEMENT + STATUS UPDATES)
