<!DOCTYPE html>
<!-- ==========================================================================
     NOVA - admin/reports.html   ***** FILE GUIDE (MASTER COMMENT) *****
     --------------------------------------------------------------------------
     IN ONE SENTENCE: The reports page of the console. It is the shell that
     reports.js fills with plain business summaries - total sales, average
     order value, best sellers and a category breakdown - read from the stored
     orders and products.

     HOW ADMIN PAGES WORK
     Standard admin recipe: storage.js, common.js and admin.js load first,
     renderAdminShell() guards access + draws the chrome, and the page script
     populates #adminContent.

     SCRIPTS LOADED: storage.js -> common.js -> admin.js -> reports.js.
     This page only reads data; it changes nothing, so it is safe to open at
     any time to review how the store is performing.
     ========================================================================== -->

     NOVA - admin/reports.html  (SALES REPORTS)
     ========================================================================== -->
