<!DOCTYPE html>
<!-- ==========================================================================
     NOVA - admin/inventory.html   ***** FILE GUIDE (MASTER COMMENT) *****
     --------------------------------------------------------------------------
     IN ONE SENTENCE: The stock-control page of the console. It is the shell
     that inventory.js fills with a list of products, each with a coloured
     stock meter and quick controls to raise, lower or set the quantity.

     HOW ADMIN PAGES WORK
     Standard admin recipe: storage.js, common.js and admin.js load first,
     renderAdminShell() guards access + draws the chrome, and the page script
     populates #adminContent.

     SCRIPTS LOADED: storage.js -> common.js -> admin.js -> inventory.js.
     Stock changes write straight back to novaProducts, which is why an item
     marked out-of-stock here immediately stops being buyable on the shop.
     ========================================================================== -->
<!-- ==========================================================================
     NOVA - admin/inventory.html  (STOCK MANAGEMENT)
     Stock edits here are reflected instantly in the customer catalogue,
     because both read the same novaProducts list.
     ========================================================================== -->
