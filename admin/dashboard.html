<!DOCTYPE html>
<!-- ==========================================================================
     NOVA - admin/dashboard.html   ***** FILE GUIDE (MASTER COMMENT) *****
     --------------------------------------------------------------------------
     IN ONE SENTENCE: The admin analytics home - the landing page of the
     console - showing sales, orders, customers, charts, notifications and
     low-stock alerts in one dark, premium dashboard.

     HOW ADMIN PAGES WORK
     Every page in this /admin folder follows the same recipe: load storage.js,
     common.js and admin.js, then a page script. admin.js -> renderAdminShell()
     checks the visitor really is an admin (requireAdmin) and paints the shared
     sidebar + top bar; the page script then fills the #adminContent area with
     its own widgets. This file just provides that empty content shell.

     SCRIPTS LOADED: storage.js -> common.js -> admin.js -> dashboard.js.
     dashboard.js computes the live numbers and draws every chart with plain
     CSS/SVG (no chart library). A demo admin login is provided (see README).
     ========================================================================== -->
<!-- ==========================================================================
     NOVA - admin/dashboard.html  (ANALYTICS OVERVIEW)
     Visual design follows reference image 1: dark rounded shell, charcoal
     panels, purple ambient glow, gradient charts, notifications, activities.
     All numbers are computed live from Local Storage.
     ========================================================================== -->
