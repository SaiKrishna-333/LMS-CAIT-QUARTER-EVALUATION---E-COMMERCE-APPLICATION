<!DOCTYPE html>
<!-- ==========================================================================
     NOVA - products.html   ***** FILE GUIDE (MASTER COMMENT) *****
     --------------------------------------------------------------------------
     IN ONE SENTENCE: The shopping catalogue page. It holds the filter sidebar
     (search, categories, price, sort) and an empty grid that products.js
     fills with product cards.

     HOW IT WORKS
     The markup defines the controls and a placeholder grid; js/products.js
     reads the full catalogue from storage.js, applies whatever filters the
     shopper touches, and paints the matching cards using the shared
     buildProductCard() from common.js. It can also open pre-filtered via a URL
     like products.html?category=Electronics (clicked from a home tile).

     SCRIPTS LOADED: storage.js -> common.js -> products.js.
     The same card everywhere means Add-to-cart, wishlist and compare work
     here exactly as they do on the homepage.
     ========================================================================== -->
<!-- ==========================================================================
     NOVA - products.html  (PRODUCT CATALOGUE)
     Search, category filter, price filter, sorting and the product grid.
     Reads URL parameters so links like products.html?category=Fashion work.
     ========================================================================== -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop &ndash; NOVA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        /* Page-specific layout: sidebar filters + product grid */
        .shop-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 26px;
            align-items: start;
        }

        .filter-card {
            position: sticky;
            top: 90px;
        }

        .filter-group {
            margin-bottom: 22px;
        }

        .filter-group h4 {
            font-size: 0.86rem;
            margin-bottom: 10px;
            color: var(--text);
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 0.85rem;
            color: var(--text-2);
            padding: 5px 0;
            cursor: pointer;
        }

        .filter-option input {
            accent-color: var(--purple);
        }

        .price-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .price-inputs input {
            width: 74px;
            padding: 8px;
        }
    </style>
</head>

<body>

    <header class="site-header" id="siteHeader"></header>

    <main class="container page-section">
        <div class="breadcrumb">
            <a href="index.html">Home</a> <span>/</span> <span class="current">Shop</span>
        </div>

        <div class="section-title" style="margin-top:6px">
            <div>
                <h1 id="pageTitle">All Products</h1>
                <div class="accent-bar"></div>
            </div>
            <p id="resultCount" style="font-size:0.85rem"></p>
        </div>

        <div class="shop-layout">
            <!-- LEFT: filter sidebar -->
            <aside class="card filter-card">
                <div class="filter-group">
                    <h4>Search</h4>
                    <input class="form-control" type="text" id="searchInput" placeholder="Search by name...">
                </div>
                <div class="filter-group">
                    <h4>Category</h4>
                    <div id="categoryFilters"></div>
                </div>
                <div class="filter-group">
                    <h4>Max price</h4>
                    <div class="price-inputs">
                        <input class="form-control" type="number" id="minPrice" min="0" placeholder="Min">
                        <span style="color:var(--text-2)">to</span>
                        <input class="form-control" type="number" id="maxPrice" min="0" placeholder="Max">
                    </div>
                </div>
                <div class="filter-group">
                    <h4>Sort by</h4>
                    <select class="form-control" id="sortSelect">
                        <option value="default">Featured</option>
                        <option value="priceLow">Price: Low to High</option>
                        <option value="priceHigh">Price: High to Low</option>
                        <option value="rating">Rating: Best first</option>
                        <option value="new">Newest arrivals</option>
                    </select>
                </div>
                <button class="btn btn-outline btn-sm" id="clearFilters" style="width:100%">Clear all filters</button>
            </aside>

            <!-- RIGHT: results grid (filled by products.js) -->
            <section>
                <div class="product-grid" id="grid"></div>
                <div id="noResults" hidden class="empty-state">
                    <div class="empty-icon"><i data-lucide="package-search"></i></div>
                    <h3>No products match</h3>
                    <p>Try a different search word, widen the price range or clear the filters.</p>
                    <button class="btn btn-primary" onclick="document.getElementById('clearFilters').click()">Clear
                        filters</button>
                </div>
            </section>
        </div>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>
    <div id="toast-area"></div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/common.js"></script>
    <script src="js/products.js"></script>
</body>

</html>
