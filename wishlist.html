<!DOCTYPE html>
<!-- ==========================================================================
     NOVA - wishlist.html   ***** FILE GUIDE (MASTER COMMENT) *****
     --------------------------------------------------------------------------
     IN ONE SENTENCE: The "saved for later" page. It shows the products the
     shopper tapped the heart on, in the familiar card grid, with a way to move
     any of them into the cart.

     HOW IT WORKS
     The saved product ids live in novaWishlist (managed by toggleWishlist() in
     common.js). wishlist.js looks each id up, reuses buildProductCard() to draw
     it, and wires the "Move to Cart" action. If nothing is saved yet a friendly
     empty state invites the shopper to browse.

     SCRIPTS LOADED: storage.js -> common.js -> wishlist.js.
     ========================================================================== -->
<!-- ==========================================================================
     NOVA - wishlist.html  (SAVED PRODUCTS)
     ========================================================================== -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist &ndash; NOVA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <header class="site-header" id="siteHeader"></header>

    <main class="container page-section">
        <div class="breadcrumb">
            <a href="index.html">Home</a> <span>/</span> <span class="current">Wishlist</span>
        </div>

        <div class="section-title">
            <div>
                <h1>My Wishlist</h1>
                <div class="accent-bar"></div>
            </div>
            <p id="wishCount" style="font-size:0.85rem"></p>
        </div>

        <div id="wishEmpty" class="empty-state" hidden>
            <div class="empty-icon"><i data-lucide="heart"></i></div>
            <h3>Your wishlist is empty</h3>
            <p>Tap the heart on any product card to save it here for later.</p>
            <a href="products.html" class="btn btn-primary">Browse Products</a>
        </div>

        <div class="product-grid" id="wishGrid"></div>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>
    <div id="toast-area"></div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/common.js"></script>
    <script src="js/wishlist.js"></script>
</body>

</html>
